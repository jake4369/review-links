name: ReviewBranch CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reviewbranch-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Database, app and E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22.18.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase
        run: npx supabase start

      - name: Reset local database
        run: npx supabase db reset --local

      - name: Configure local Supabase environment
        shell: bash
        run: |
          API_URL="$(
            npx supabase status -o env |
            grep '^API_URL=' |
            cut -d= -f2- |
            tr -d '"'
          )"

          PUBLISHABLE_KEY="$(
            npx supabase status -o env |
            grep '^PUBLISHABLE_KEY=' |
            cut -d= -f2- |
            tr -d '"'
          )"

          if [ -z "$API_URL" ] || [ -z "$PUBLISHABLE_KEY" ]; then
            echo "Unable to read the local Supabase environment."
            exit 1
          fi

          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY" >> "$GITHUB_ENV"

      - name: Run database regression tests
        run: npx supabase test db --local

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript checks
        run: npx tsc --noEmit

      - name: Build application
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run Playwright E2E tests
        run: npx playwright test

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
